<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar System</title>
<style>
:root{
  --space:#070b1a; --ink:#e8ecf8; --muted:#8e98b8; --orbit:rgba(160,175,220,.18);
  --sun:#ffb62e; --sun-glow:#ff7a18;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% 40%,#0f1636 0%,var(--space) 70%);
  color:var(--ink); font-family:"Trebuchet MS","Gill Sans",Verdana,sans-serif;
  display:flex; flex-direction:column; align-items:center; overflow-x:hidden;
}
h1{font-size:clamp(1.3rem,3vw,1.9rem); font-weight:600; letter-spacing:.02em; margin:1.2rem 1rem .2rem; text-align:center}
p.sub{margin:0 1rem 0; color:var(--muted); font-size:.9rem; text-align:center}

/* star field */
.stars{position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
   radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),
   radial-gradient(1px 1px at 30% 70%,#fff,transparent),
   radial-gradient(1.5px 1.5px at 55% 12%,#cfe0ff,transparent),
   radial-gradient(1px 1px at 72% 82%,#fff,transparent),
   radial-gradient(1.5px 1.5px at 88% 35%,#fff,transparent),
   radial-gradient(1px 1px at 20% 90%,#ffe9c4,transparent),
   radial-gradient(1px 1px at 94% 8%,#fff,transparent),
   radial-gradient(1px 1px at 6% 52%,#fff,transparent);}

/* scene scales with viewport */
.scene{position:relative; z-index:1; width:min(94vw,860px); aspect-ratio:1; margin:.5rem auto; --u:calc(min(94vw,860px)/860)}
.sun{position:absolute; left:50%; top:50%; width:calc(90*var(--u)); height:calc(90*var(--u)); margin:calc(-45*var(--u)) 0 0 calc(-45*var(--u));
  border-radius:50%; background:radial-gradient(circle at 35% 35%,#fff3b0,var(--sun) 45%,var(--sun-glow));
  box-shadow:0 0 calc(40*var(--u)) calc(14*var(--u)) rgba(255,150,30,.55),0 0 calc(110*var(--u)) calc(34*var(--u)) rgba(255,110,20,.25);
  animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 calc(50*var(--u)) calc(18*var(--u)) rgba(255,150,30,.65),0 0 calc(130*var(--u)) calc(40*var(--u)) rgba(255,110,20,.3)}}

/* each orbit: a ring that rotates; planet sits on its edge */
.orbit{position:absolute; left:50%; top:50%; border:1px solid var(--orbit); border-radius:50%;
  width:calc(var(--d)*var(--u)); height:calc(var(--d)*var(--u));
  margin:calc(var(--d)*var(--u)/-2) 0 0 calc(var(--d)*var(--u)/-2);
  animation:spin var(--t) linear infinite; animation-delay:var(--delay,0s)}
@keyframes spin{to{transform:rotate(360deg)}}
.planet{position:absolute; left:50%; top:0; border-radius:50%;
  width:calc(var(--s)*var(--u)); height:calc(var(--s)*var(--u));
  margin:calc(var(--s)*var(--u)/-2) 0 0 calc(var(--s)*var(--u)/-2);
  background:var(--c); box-shadow:inset calc(-4*var(--u)) calc(-4*var(--u)) calc(7*var(--u)) rgba(0,0,0,.55);
  animation:counter var(--t) linear infinite; animation-delay:var(--delay,0s)}
@keyframes counter{to{transform:rotate(-360deg)}}
.planet::after{content:attr(data-name); position:absolute; left:50%; top:100%; transform:translateX(-50%);
  margin-top:3px; font-size:clamp(8px,1.3vw,12px); color:var(--muted); white-space:nowrap; pointer-events:none}

/* specifics: d = orbit diameter, s = planet size, t = orbit time */
.mercury{--d:150;--s:9;--c:radial-gradient(circle at 35% 35%,#d8d2c8,#8a8378);--t:7s}
.venus{--d:210;--s:16;--c:radial-gradient(circle at 35% 35%,#f6dca0,#c58b3c);--t:12s;--delay:-3s}
.earth{--d:280;--s:18;--c:radial-gradient(circle at 35% 35%,#7fc4ff,#1f5fb8 60%,#2e8b57);--t:18s;--delay:-6s}
.mars{--d:345;--s:13;--c:radial-gradient(circle at 35% 35%,#ff9a6b,#b03a1a);--t:26s;--delay:-10s}
.jupiter{--d:470;--s:42;--c:linear-gradient(180deg,#e8cfa8 0 20%,#b98558 20% 38%,#e8cfa8 38% 55%,#a8704a 55% 72%,#e0c49c 72%);--t:46s;--delay:-20s}
.saturn{--d:590;--s:34;--c:radial-gradient(circle at 35% 35%,#f0dba6,#b69a5e);--t:64s;--delay:-8s}
.uranus{--d:700;--s:24;--c:radial-gradient(circle at 35% 35%,#c8f4f5,#5bb8c2);--t:88s;--delay:-40s}
.neptune{--d:800;--s:23;--c:radial-gradient(circle at 35% 35%,#8fb0ff,#2c46b8);--t:110s;--delay:-70s}

/* saturn's ring */
.saturn .planet::before{content:""; position:absolute; left:50%; top:50%; width: 190%; height:56%;
  transform:translate(-50%,-50%) rotate(-18deg); border-radius:50%;
  border:calc(4*var(--u)) solid rgba(222,198,140,.75); box-shadow:0 0 0 calc(2*var(--u)) rgba(222,198,140,.25)}

/* earth's moon */
.moon-orbit{position:absolute; left:50%; top:50%; width:calc(40*var(--u)); height:calc(40*var(--u));
  margin:calc(-20*var(--u)) 0 0 calc(-20*var(--u)); animation:spin 3s linear infinite}
.moon{position:absolute; left:50%; top:0; width:calc(5*var(--u)); height:calc(5*var(--u)); margin-left:calc(-2.5*var(--u));
  border-radius:50%; background:#d9d9d9}

/* asteroid belt */
.belt{position:absolute; left:50%; top:50%; width:calc(405*var(--u)); height:calc(405*var(--u));
  margin:calc(-202.5*var(--u)) 0 0 calc(-202.5*var(--u)); border-radius:50%;
  border:calc(10*var(--u)) dotted rgba(170,160,145,.4); animation:spin 160s linear infinite}

.hint{position:relative; z-index:1; color:var(--muted); font-size:.8rem; margin:.5rem 1rem 1.5rem; text-align:center}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation:none!important}}
</style>
</head>
<body>
<div class="stars"></div>
<h1>The Solar System</h1>

<div class="scene" role="img" aria-label="Animated model of the solar system with eight planets orbiting the sun">
  <div class="sun"></div>

  <div class="orbit mercury"><div class="planet" data-name="Mercury"></div></div>
  <div class="orbit venus"><div class="planet" data-name="Venus"></div></div>
  <div class="orbit earth"><div class="planet" data-name="Earth"><div class="moon-orbit"><div class="moon"></div></div></div></div>
  <div class="orbit mars"><div class="planet" data-name="Mars"></div></div>

  <div class="belt"></div>

  <div class="orbit jupiter"><div class="planet" data-name="Jupiter"></div></div>
  <div class="orbit saturn"><div class="planet" data-name="Saturn"></div></div>
  <div class="orbit uranus"><div class="planet" data-name="Uranus"></div></div>
  <div class="orbit neptune"><div class="planet" data-name="Neptune"></div></div>
</div>


</body>
</html>
